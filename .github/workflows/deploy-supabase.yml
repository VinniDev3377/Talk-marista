name: Publicar alterações no Supabase

on:
  push:
    branches:
      - main
    paths:
      - "backend/supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar credenciais do Supabase
        id: credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secrets do Supabase não configurados; publicação não executada."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.configured == 'true'
        with:
          version: latest
      - name: Vincular projeto Supabase
        if: steps.credentials.outputs.configured == 'true'
        run: supabase --workdir backend link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrações do banco
        if: steps.credentials.outputs.configured == 'true'
        run: supabase --workdir backend db push --yes
      - name: Publicar funções do Supabase
        if: steps.credentials.outputs.configured == 'true'
        run: |
          supabase --workdir backend functions deploy portaria-user-admin
          supabase --workdir backend functions deploy resident-register-
