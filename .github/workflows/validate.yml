name: Validar Talk Marista

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos e compilar
        run: npm run build
      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar Edge Functions
        run: |
          deno check backend/supabase/functions/portaria-user-admin/index.ts
          deno check backend/supabase/functions/resident-register-/index.ts
      - name: Preparar pacote ZIP do código atualizado
        run: zip -r talk-marista-codigo-atualizado.zip . -x ".git/*" "node_modules/*" "dist/*" ".vercel/*" "talk-marista-codigo-atualizado.zip" ".env" ".env.*"
      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: talk-marista-codigo-atualizado
          path: talk-marista-codigo-atualizado.zip
          retention-days: 30
