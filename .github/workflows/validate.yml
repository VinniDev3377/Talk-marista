name: Validar Talk Marista

on:
  push:
    branches:
      - main
      - fix/portaria-reservas-resumo-apartamentos
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos e compilar
        run: npm run build
