name: Validar Talk Marista

on:
  push:
    branches:
      - main
      - feat/admin-perfis-fotos-desktop-ui
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos e compilar
        run: npm run build
      - name: Configurar Deno para validar a Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar função de administração do Supabase
        run: deno check supabase/functions/portaria-user-admin/index.ts
      - name: Preparar pacote ZIP do código atualizado
        run: zip -r talk-marista-codigo-atualizado.zip . -x ".git/*" "node_modules/*" "dist/*" ".vercel/*" "talk-marista-codigo-atualizado.zip" ".env" ".env.local" ".env.production"
      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: talk-marista-codigo-atualizado
          path: talk-marista-codigo-atualizado.zip
          retention-days: 30
